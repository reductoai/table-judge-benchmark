<td>1.方式：進入本校招生考試系統(<u>https://exam.ntou.edu.tw/</u>)後，請點選【索取繳費帳號】，進入申請畫面後，請輸入欲報考學系組、考生本人資料及畫面顯示之驗證碼後，按下「確認申請」。電腦將顯示繳費帳號，並提供<u>繳費單</u>下載。系統會將帳號寄至電子郵件信箱。<br/>2.「考生姓名」及「身分證字號」輸入後不可修改。<br/>3.每個繳費帳號僅供一位考生報考一個學系組(或聯招群組)使用。如欲同時報考二個以上，需索取二個以上繳費帳號，並分別繳交報名費及上網填寫報名表。取得之帳號僅限考生個人使用，切勿提供他人使用。</td>
