<td style="font-weight: bold; font-style: italic">目 的</td>
<td style="font-weight: bold; font-style: italic">市内での創業を考えている者及び創業間もない者を支援することにより、市内における創業を促進するとともに、創業後の経営基盤を安定させ、市内経済の活性化を図ることを目的とする。</td>
</tr>
<tr>
<td>根 拠</td>
<td>登別市創業支援事業補助金交付要綱（登別市空き店舗活用事業補助金、登別市事業所開設費補助金）</td>
</tr>
<tr>
<td>対 象</td>
<td>・「登別市空き店舗活用事業補助金」<br/>市内にある空き店舗を活用して新たに事業を行う者<br/>・「登別市事業所開設費補助金」<br/>市内において新たに事業を行う者</td>
</tr>
