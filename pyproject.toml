[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "table-judge-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for multimodal table-HTML judges"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.100",
]

[project.optional-dependencies]
providers = [
  "anthropic>=0.60",
  "google-genai>=1.30",
]
render = [
  "pillow==12.2.0",
  "pypdfium2==4.30.0",
  "weasyprint==68.1",
]

[project.scripts]
table-judge-run = "table_judge_benchmark.benchmark:main"
table-judge-analyze = "table_judge_benchmark.analysis:main"

[tool.hatch.build.targets.wheel]
packages = ["src/table_judge_benchmark"]
